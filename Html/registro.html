<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea tu cuenta - Elixir and Flexx</title>
    <link rel="stylesheet" href="estilos_elixir.css">
</head>
<body>
    <div class="contenedor-principal">
        <div class="tarjeta-form">
            <h1>CREA TU CUENTA</h1>
            <p class="subtitulo">REGÍSTRATE PARA COMPRAR MÁS RÁPIDO</p>
            
            <form>
                <input type="text" placeholder="INGRESE SU NOMBRE COMPLETO" required>
                <input type="number" placeholder="INGRESE SU EDAD" required>
                <input type="email" placeholder="EMAIL" required>
                <input type="password" placeholder="CONTRASEÑA" required>
                
                <a href="#" class="olvido">¿Olvidaste la contraseña?</a>
                
                <button type="submit" class="btn-principal">INICIAR SESION</button>
            </form>
            
            <div class="separador">
                <hr> <span>o</span> <hr>
            </div>
            
            <div class="botones-sociales">
                <button class="btn-social google">CONTINUAR CON GOOGLE</button>
                <button class="btn-social facebook">CONTINUAR CON FACEBOOK</button>
            </div>
        </div>
    </div>
</body>
</html>
