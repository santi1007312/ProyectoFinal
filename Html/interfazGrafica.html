<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elixir and Flexx</title>
    <link rel="stylesheet" href="/Css/estilos_home.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">ELIXIRANDFLEXX</div>
            <ul class="nav-links">
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Catalogo</a></li>
                <li><a href="#">Guia de tallas</a></li>
                <li><a href="#">Politicas de devolucion</a></li>
            </ul>
            <div class="nav-icons">
                <i class="bx bx-search"></i>
                <i class="bx bx-user"></i>
                <i class="bx bx-shopping-bag"></i>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="banner-container">
                <img src="/images/el_estilo_de_asap_rocky_947117425.webp" alt="Fashion Editorial" class="img-main">
                <div class="card-producto">
                    <img src="/images/bmm92840_black_xl.webp" alt="Hoodie #19">
                    <div class="info">
                        <h3>Hoodie #19 boohhooMAN</h3>
                        <p>$65.000 COP</p>
                    </div>
                </div>
                <a href="#seccion-lanzamientos" class="btn-lanzamiento">
                    <span>NUEVOS LANZAMIENTOS</span>
                </a>
            </div>
        </section>
        <section class="action-bar">
            <button class="btn-red">VER CATALOGO</button>
            <button class="btn-red">PEDIR POR WHATSAPP</button>
        </section>
    </main>

    <section id="seccion-lanzamientos" class="nuevos-lanzamientos">
        <div class="titulo-lanzamientos">
            <h2>NUEVOS LANZAMIENTOS</h2>
        </div>
    
        <div class="grid-lanzamientos">
            <div class="producto-lanzamiento">
                <img src="/images/8e281690b314c15d3997f211f95c8783.jpg" alt="Collection #19">
                <div class="info-lanzamiento">
                    <h4>Collection #19</h4>
                    <p>$60.000</p>
                </div>
            </div>

            <div class="producto-lanzamiento">
                <img src="/images/89a1919bf16e2679f99bd0461960b0de.jpg" alt="Collection #20">
                <div class="info-lanzamiento">
                    <h4>Collection #20</h4>
                    <p>$70.000</p>
                </div>
        </div>

            <div class="producto-lanzamiento">
                <img src="/images/91e29a59296ade0d281a53969b3ca2ee.jpg" alt="Collection #21">
                <div class="info-lanzamiento">
                    <h4>Collection #21</h4>
                    <p>$70.000</p>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
