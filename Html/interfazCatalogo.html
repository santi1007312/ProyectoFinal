<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elixir and Flexx - Catalogo</title>
    <link rel="stylesheet" href="/Css/estilos_catalogo.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">ELIXIRANDFLEXX</div>
            <ul class="nav-links">
                <li><a href="home.html">Inicio</a></li> <li><a href="#" class="active">Catalogo</a></li>
                <li><a href="#">Guia de tallas</a></li>
                <li><a href="#">Pedidos</a></li>
            </ul>
            <div class="nav-icons">
                <i class="bx bx-search"></i>
                <i class="bx bx-user"></i>
                <i class="bx bx-shopping-bag"></i>
            </div>
        </nav>
    </header>

    <main class="contenedor-catalogo">
        <div class="encabezado-catalogo">
            <span class="subtitulo-sena">SOLO SENA</span>
            <h1 class="titulo-seccion">CATALOGO</h1>
        </div>

        <section class="grid-categorias">
            
            <a href="#" class="tarjeta-categoria">
                <div class="contenedor-img">
                    <img src="/images/pistola_masaje.png" alt="Hoodies">
                </div>
                <div class="info-categoria">
                    <h3>HOODIES <span>&gt;</span></h3>
                </div>
            </a>

            <a href="#" class="tarjeta-categoria">
                <div class="contenedor-img">
                    <img src="/images/pistola_masaje.png" alt="Camisas">
                </div>
                <div class="info-categoria">
                    <h3>CAMISAS <span>&gt;</span></h3>
                </div>
            </a>

            <a href="#" class="tarjeta-categoria">
                <div class="contenedor-img">
                    <img src="/images/pistola_masaje.png" alt="Sudaderas">
                </div>
                <div class="info-categoria">
                    <h3>SUDADERAS <span>&gt;</span></h3>
                </div>
            </a>

            <a href="#" class="tarjeta-categoria">
                <div class="contenedor-img">
                    <img src="/images/pistola_masaje.png" alt="Zapatos">
                </div>
                <div class="info-categoria">
                    <h3>ZAPATOS <span>&gt;</span></h3>

            <a href="#" class="tarjeta-categoria">
                <div class="contenedor-img">

                </div>
                <div class="info-categoria">
                    <h3>HOODIES Y SUDADERA <span>&gt;</span></h3>
                </div>
            </a>

            <a href="#" class="tarjeta-categoria">
                <div class="contenedor-img">
                    <img src="/images/pistola_masaje.png" alt="Pantalonetas">
                </div>
                <div class="info-categoria">
                    <h3>PANTALONETAS <span>&gt;</span></h3>
                </div>
            </a>

            <a href="#" class="tarjeta-categoria">
                <div class="contenedor-img">
                    <img src="/images/pistola_masaje.png" alt="Conjuntos">
                </div>
                <div class="info-categoria">
                    <h3>CONJUNTOS <span>&gt;</span></h3>
                </div>
            </a>

            <a href="#" class="tarjeta-categoria">
                <div class="contenedor-img">
                    <img src="/images/pistola_masaje.png" alt="Edición Limitada">
                </div>
                <div class="info-categoria">
                    <h3>EDICION LIMITADA <span>&gt;</span></h3>
                </div>
            </a>

        </section>
