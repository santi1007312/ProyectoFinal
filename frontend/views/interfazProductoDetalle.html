<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto - Elixir and Flexx</title>
    <link rel="stylesheet" href="../public/css/global.css">
    <link rel="stylesheet" href="../public/css/estilos_detalle.css"> 
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>

<!-- HEADER ESTANDARIZADO PARA TODAS LAS VISTAS -->
    <header>
        <nav class="nav-bar">
            <div class="nav-bar__logo">ELIXIRANDFLEXX</div>
            
            <ul class="nav-bar__links">
                <li><a href="interfazGrafica.html" class="nav-bar__link">Inicio</a></li>
                <li><a href="interfazCatalogo.html" class="nav-bar__link">Catalogo</a></li>
                <li><a href="interfazGuiaTallas.html" class="nav-bar__link">Guia de tallas</a></li>
                <li><a href="interfazPedidos.html" class="nav-bar__link">Pedidos</a></li>
                
                <!-- ITEM DROPDOWN UNIFICADO -->
                <li class="nav-bar__item--dropdown">
                    <a href="#" class="nav-bar__link" id="dropdownToggle">
                        Politicas de Devolucion <i class="bx bx-chevron-down dropdown-arrow"></i>
                    </a>
                    <ul class="nav-bar__dropdown-menu" id="headerDropdown">
                        <li><a href="interfazDevoluciones.html?seccion=devoluciones" class="nav-bar__dropdown-link">Politicas de Devolucion</a></li>
                        <li><a href="interfazDevoluciones.html?seccion=contacto" class="nav-bar__dropdown-link">Contacto</a></li>
                    </ul>
                </li>
            </ul>
            
            <div class="nav-bar__icons">
                <i class="bx bx-search nav-bar__icon"></i>
                <a href="interfazPerfil.html" style="color: inherit; text-decoration: none;">
                    <i class="bx bx-user nav-bar__icon"></i>
                </a>
                <a href="interfazCarrito.html" style="color: inherit; text-decoration: none;">
                    <i class="bx bx-shopping-bag nav-bar__icon"></i>
                </a>
            </div>
        </nav>
    </header>

    <main class="title-view">
        <div class="title-view__header">
            <span class="title-view__badge">SOLO SENA</span>
        </div>
    </main>

    <!-- DETALLE DEL PRODUCTO DINÁMICO -->
    <main class="product-detail-container">
        <!-- Columna Izquierda: Imagen del Producto -->
        <div class="product-gallery">
            <img id="productDetailImg" src="../public/images/default.webp" alt="Cargando producto..." class="main-product-img">
        </div>

        <!-- Columna Derecha: Información y Opciones de Compra -->
        <div class="product-info-panel">
            <!-- Fecha de Lanzamiento -->
            <div id="productReleaseContainer" class="release-date-badge" style="display: none;">
                <span class="release-icon">🚀</span> <span id="productReleaseDate"></span>
            </div>

            <h1 id="productDetailName" class="product-title">Cargando prenda...</h1>
            <p id="productDetailPrice" class="product-price">$0,00 COP</p>
            
            <!-- Descripción del Producto -->
            <p id="productDetailDesc" class="product-description"></p>

            <hr class="divider">

            <!-- Selector de Color -->
            <div class="option-group">
                <label class="group-label">Color: <span id="selectedColorDisplay" class="highlight-text">Negro</span></label>
                <div class="color-options-container" id="colorContainer">
                    <!-- JS inyectará los círculos de colores aquí -->
                </div>
            </div>

            <!-- Selector de Talla -->
            <div class="option-group">
                <label class="group-label">Talla seleccionada: <span id="selectedTallaDisplay" class="highlight-text">S</span></label>
                <div class="size-options-container" id="tallaContainer">
                    <!-- JS inyectará los bloques de tallas aquí -->
                </div>
            </div>

            <!-- Selector de Cantidad -->
            <div class="quantity-section">
                <div id="cartStatusText" class="cart-status-text">Cantidad (0 en el carrito)</div>
                <div class="quantity-selector">
                    <button type="button" id="btnDecrement" class="qty-btn">-</button>
                    <span id="qtyDisplay" class="qty-display">1</span>
                    <button type="button" id="btnIncrement" class="qty-btn">+</button>
                </div>
            </div>

            <!-- Botón de Acción -->
            <div class="action-container">
                <button id="btnAddToCart" class="btn-add-cart">Añadir al carrito</button>
                <button id="btnBuyNow" class="btn-buy-now">Comprar ahora</button>
            </div>
        </div>
    </main>

    <!-- MODAL DE CONFIRMACIÓN FLOTANTE -->
    <div id="cartModal" class="floating-modal" style="display: none;">
        <div class="floating-modal-content">
            <div class="floating-modal-header">
                <span class="header-title">✓ Artículo agregado a tu carrito</span>
                <button id="btnCloseModal" class="modal-close-btn">&times;</button>
            </div>
            <div class="floating-modal-product-row">
                <img id="modalProductImg" src="" alt="Producto" class="modal-product-thumb">
                <div class="modal-product-info">
                    <div id="modalProductTitle" class="modal-product-title"></div>
                    <div class="modal-product-meta">Color: <span id="modalProductColor"></span></div>
                    <div class="modal-product-meta">Talla: <span id="modalProductTalla"></span></div>
                </div>
            </div>
            <button id="btnModalViewCart" class="modal-btn modal-btn-dark">Ver carrito (0)</button>
            <button id="btnModalCheckout" class="modal-btn modal-btn-light">Pagar pedido</button>
            <div style="text-align: center; margin-top: 15px;">
                <a href="#" id="lnkModalContinue" class="modal-continue-link">Seguir comprando</a>
            </div>
        </div>
    </div>

    <!-- Lógica de interconexión -->
    <script src="../public/js/main.js" type="module"></script>
    <script src="../public/js/views/detalle.js" type="module"></script>
</body>
</html>
