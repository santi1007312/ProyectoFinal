<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea tu cuenta - Elixir and Flexx</title>
    <link rel="stylesheet" href="/frontend/public/css/global.css">
    <link rel="stylesheet" href="/frontend/public/css/estilos_elixir.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h1 class="auth-card__title">CREA TU CUENTA</h1>
            <p class="auth-card__subtitle">REGÍSTRATE PARA COMPRAR MÁS RÁPIDO</p>
            <div id="registroMessage" class="auth-message"></div>
            
            <form id="formRegistro" action="UsuarioController" method="POST">
    
                <input type="hidden" name="accion" value="registrar">

                <div class="input-group">
                    <label>Nombre</label>
                    <input type="text" name="nombre" required>
                </div>

                <div class="input-group">
                    <label>Apellido</label>
                    <input type="text" name="apellido" required>
                </div>

                <div class="input-group">
                    <label>Edad</label>
                    <input type="number" name="edad" required>
                </div>

                <div class="input-group">
                    <label>Teléfono</label>
                    <input type="text" name="telefono" required>
                </div>

                <div class="input-group">
                    <label>Correo Electrónico</label>
                    <input type="email" name="email" required>
                </div>

                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" name="contrasena" required>
                </div>

                <button type="submit" class="btn-urban">CREAR CUENTA</button>
            </form>

            <div class="auth-card__footer">
                <p>¿YA TIENES CUENTA? <a href="login.html" class="auth-card__redirect">INICIA SESIÓN</a></p>
            </div>
            
            <div class="auth-card__divider">
                <hr> <span>o</span> <hr>
            </div>
            
            <div class="auth-card__socials">
                <button class="btn btn--social">CONTINUAR CON GOOGLE</button>
                <button class="btn btn--social">CONTINUAR CON FACEBOOK</button>
            </div>
        </div>
    </div>
    <script src="/frontend/public/js/views/registro.js" type="module"></script>
</body>
</html>
