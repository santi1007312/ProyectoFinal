<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Elixir and Flexx</title>
    <link rel="stylesheet" href="/frontend/public/css/global.css">
    <link rel="stylesheet" href="/frontend/public/css/estilos_admin.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body class="admin-body">

    <div class="admin-container">
        <aside class="admin-sidebar">
            <div class="admin-sidebar__logo">
                <h2>ELIXIR & FLEXX</h2>
                <span>Panel Admin</span>
            </div>
            
            <nav class="admin-sidebar__nav">
                <a href="#" class="nav-item active" data-target="dashboard">
                    <i class='bx bx-grid-alt'></i> <span>Dashboard</span>
                </a>
                <a href="#" class="nav-item" data-target="productos">
                    <i class='bx bx-closet'></i> <span>Productos & Stock</span>
                </a>
                <a href="#" class="nav-item" data-target="ventas">
                    <i class='bx bx-receipt'></i> <span>Ventas & Pedidos</span>
                </a>
                <a href="#" class="nav-item" data-target="usuarios">
                    <i class='bx bx-user-voice'></i> <span>Control Usuarios</span>
                </a>
            </nav>

            <div class="admin-sidebar__footer">
                <button id="btnCerrarSesionLocal" class="btn-logout"><i class='bx bx-log-out'></i> Salir</button>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <div class="admin-header__title">
                    <h1 id="adminSectionTitle">Dashboard General</h1>
                </div>
                <div class="admin-header__user">
                    <span>Administrador</span>
                    <div class="avatar-mini">A</div>
                </div>
            </header>

            <section id="adminDynamicContent" class="admin-content">
                </section>
        </main>
    </div>

    <script src="/frontend/public/js/views/admin.js" type="module"></script>
</body>
</html>
