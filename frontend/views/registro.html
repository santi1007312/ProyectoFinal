<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea tu cuenta - Elixir and Flexx</title>
    <link rel="stylesheet" href="../public/css/global.css">
    <link rel="stylesheet" href="../public/css/estilos_elixir.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h1 class="auth-card__title">CREA TU CUENTA</h1>
            <p class="auth-card__subtitle">REGÍSTRATE PARA COMPRAR MÁS RÁPIDO</p>
            
            <form class="auth-form" action="interfazGrafica.html" method="GET">
                <input type="text" class="auth-form__input" placeholder="INGRESE SU NOMBRE COMPLETO" required>
                <input type="number" class="auth-form__input" placeholder="INGRESE SU EDAD" required>
                <input type="email" class="auth-form__input" placeholder="EMAIL" required>
                <input type="password" class="auth-form__input" placeholder="CONTRASEÑA" required>
                
                <button type="submit" class="btn btn--olive">REGISTRARSE</button>
            </form>

            <div class="auth-card__footer">
                <p>¿YA TIENES CUENTA? <a href="login.html" class="auth-card__redirect">INICIA SESIÓN</a></p>
            </div>
            
            <div class="auth-card__divider">
                <hr> <span>o</span> <hr>
            </div>
            
            <div class="auth-card__socials">
                <button class="btn btn--social">CONTINUAR CON GOOGLE</button>
                <button class="btn btn--social">CONTINUAR CON FACEBOOK</button>
            </div>
        </div>
    </div>
</body>
</html>
